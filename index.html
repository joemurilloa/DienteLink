<!DOCTYPE html>
<html lang="es" class="h-full">

<head>
    <script>
      // Always light mode — dark mode temporarily disabled
      document.documentElement.classList.remove('dark');
      document.documentElement.style.backgroundColor = '#F8FAFC';
      localStorage.setItem('dientelink_theme', 'light');
    </script>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' https: wss: data: blob: 'unsafe-inline' 'unsafe-eval';">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <!-- Theme & PWA -->
    <meta name="theme-color" content="#3b82f6">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="DienteLink">
    <meta name="application-name" content="DienteLink">

    <!-- SEO -->
    <meta name="description" content="Gestión dental profesional: expedientes clínicos, odontogramas, agenda de citas y reservas online.">
    <meta name="keywords" content="odontología, gestión dental, expediente clínico, odontograma, citas dentales">

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg">
    <link rel="apple-touch-icon" href="/pwa-192x192.png">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <title>DienteLink | Gestión Dental Profesional</title>

    <style>
        /* Splash screen styles — inlined to avoid FOUC */
        #initial-loader {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #F8FAFC;
            z-index: 9999;
            transition: opacity 0.4s ease;
            gap: 16px;
        }

        #initial-loader .logo-wrap {
            width: 72px;
            height: 72px;
            background: #2563eb;
            border-radius: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            box-shadow: 0 20px 50px rgba(59,130,246,0.35);
            animation: splash-pulse 1.6s ease-in-out infinite;
        }

        #initial-loader .logo-text {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 800;
            font-size: 18px;
            letter-spacing: -0.03em;
            color: #0f172a;
        }

        #initial-loader .logo-sub {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 600;
            font-size: 11px;
            letter-spacing: 0.12em;
            color: #94a3b8;
            text-transform: uppercase;
            margin-top: -10px;
        }

        @keyframes splash-pulse {
            0%, 100% { transform: scale(1); box-shadow: 0 20px 50px rgba(59,130,246,0.35); }
            50%       { transform: scale(1.06); box-shadow: 0 28px 60px rgba(59,130,246,0.45); }
        }
    </style>
</head>

<body class="h-full overflow-hidden mesh-bg">
    <div id="initial-loader">
        <div class="logo-wrap">🦷</div>
        <div class="logo-text">DIENTELINK</div>
        <div class="logo-sub">Gestión Dental</div>
    </div>
    <div id="root" class="h-full"></div>
    <script type="module" src="/index.tsx"></script>
    <script>
        window.addEventListener('load', () => {
            const loader = document.getElementById('initial-loader');
            if (loader) {
                loader.style.opacity = '0';
                setTimeout(() => loader.remove(), 450);
            }
        });
    </script>

</body>

</html>
