<!DOCTYPE html>
<html lang="es" class="h-full">

<head>
    <script>
      // Always light mode — dark mode temporarily disabled
      document.documentElement.classList.remove('dark');
      document.documentElement.style.backgroundColor = '#F8FAFC';
      localStorage.setItem('dientelink_theme', 'light');
      // Old HashRouter links: /#/welcome → /welcome. Ignore OAuth hashes and #anchors.
      if (location.hash.indexOf('#/') === 0) {
        location.replace(location.hash.slice(1) + location.search);
      }
    </script>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' https: wss: data: blob: 'unsafe-inline' 'unsafe-eval';">

        content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <!-- SEO -->

    <meta name="twitter:card" content="summary_large_image">

    <meta name="twitter:description" content="Agenda, expediente y odontograma para consultorios dentales en Honduras.">
    <meta name="twitter:image" content="https://diente-link.vercel.app/og-preview.png">

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg">
    <link rel="apple-touch-icon" href="/pwa-192x192.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,620&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <title>DienteLink | Agenda, expediente y odontograma</title>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "DienteLink",
        "url": "https://diente-link.vercel.app/welcome",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web",
        "inLanguage": "es",
        "description": "Agenda, expediente y odontograma para consultorios dentales en Honduras.",
        "offers": {
          "@type": "Offer",
          "price": "250",
          "priceCurrency": "HNL",
          "description": "Un consultorio, L. 250 al mes, con 14 días de prueba"
        },
        "featureList": [
          "Agenda de citas",
          "Expediente clínico",
          "Odontograma",
          "Presupuestos del tratamiento",
          "Reservas en línea"
        ]
      }
    </script>

    <style>
        /* Splash screen styles — inlined to avoid FOUC */
        #initial-loader {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #F8FAFC;
            z-index: 9999;
            transition: opacity 0.4s ease;
            gap: 16px;
        }

        #initial-loader .logo-wrap {
            width: 64px;
            height: 64px;
            background: #1b3830;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #initial-loader .logo-text {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 700;
            font-size: 18px;
            letter-spacing: -0.03em;
            color: #0f172a;
        }

        #initial-loader .logo-sub {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 500;
            font-size: 13px;
            color: #64748b;
            margin-top: -8px;
        }
    </style>
</head>

<body class="h-full overflow-hidden mesh-bg">
    <div id="initial-loader">
        <div class="logo-wrap" aria-hidden="true">
            <svg width="36" height="36" viewBox="0 0 48 48" fill="none">
                <path d="M24 6C16.8 6 11 11.2 11 17.5C11 22.8 13.5 27.2 15.8 33.2C17.4 37.4 19.5 42 21.2 42C22.6 42 23.3 39.8 23.8 36.5C24 35.2 24 33.8 24 32.5C24 33.8 24 35.2 24.2 36.5C24.7 39.8 25.4 42 26.8 42C28.5 42 30.6 37.4 32.2 33.2C34.5 27.2 37 22.8 37 17.5C37 11.2 31.2 6 24 6Z" fill="#ffffff"/>
            </svg>
        </div>
        <div class="logo-text">DienteLink</div>
        <div class="logo-sub">Consultorios dentales</div>
    </div>
    <div id="root" class="h-full"></div>
    <script type="module" src="/index.tsx"></script>
    <script>
        window.addEventListener('load', () => {
            const loader = document.getElementById('initial-loader');
            if (loader) {
                loader.style.opacity = '0';
                setTimeout(() => loader.remove(), 450);
            }
        });
    </script>

</body>

</html>
