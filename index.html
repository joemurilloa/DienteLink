<!DOCTYPE html>
<html lang="es" class="h-full bg-[#F8FAFC]">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#3b82f6">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://picsum.photos/180/180">
    <title>DienteLink | Gestión Dental Profesional</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="manifest" href="/manifest.json">
</head>

<body class="h-full overflow-hidden mesh-bg">
    <div id="initial-loader">
        <div
            class="w-16 h-16 bg-blue-600 rounded-[22px] flex items-center justify-center text-white text-3xl shadow-[0_20px_50px_rgba(59,130,246,0.3)] animate-bounce">
            🦷</div>
        <div class="mt-4 font-bold text-slate-900 tracking-tighter text-xl">DIENTELINK</div>
    </div>
    <div id="root" class="h-full"></div>
    <script type="module" src="/index.tsx"></script>
    <script>
        window.addEventListener('load', () => {
            const loader = document.getElementById('initial-loader');
            if (loader) {
                loader.style.opacity = '0';
                setTimeout(() => loader.remove(), 500);
            }
        });
    </script>
    <script>
        // PWA Service Worker Registration (production only)
        if ('serviceWorker' in navigator && window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1') {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then((reg) => console.log('DienteLink SW registered:', reg.scope))
                    .catch((err) => console.log('SW registration failed:', err));
            });
        }
    </script>
</body>

</html>
