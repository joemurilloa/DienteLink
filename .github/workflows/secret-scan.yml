name: Secret scan

on:
  workflow_dispatch: # Manual trigger only (remove this and uncomment below to re-enable)

# on:
#   pull_request:
#     types: [opened, synchronize, reopened]
#   push:
#     branches: [ main ]

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
