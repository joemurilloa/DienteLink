name: Secret scan

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [ main ]

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run gitleaks scan
        uses: zricethezav/gitleaks-action@v2
        with:
          args: '--config-path .gitleaks.toml'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
